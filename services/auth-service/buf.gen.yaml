version: v2

inputs:
  - directory: .
    paths:
      - proto/auth
      - proto/common
      - proto/customer

plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/danila-kuryakin/banking_mini_cores/services/auth-service
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/danila-kuryakin/banking_mini_cores/services/auth-service