syntax = "proto3";

package auth.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/auth-service/internal/pb/gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";
import "common/v1/actor.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (User);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc CreateOfficer(RegisterRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}


message User {
  string id = 1;
  string email = 2;
  common.v1.Role role = 3;
  google.protobuf.Timestamp created_at = 4;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string id = 2;
  common.v1.Role role = 3;
  google.protobuf.Timestamp expires_at = 5;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}
