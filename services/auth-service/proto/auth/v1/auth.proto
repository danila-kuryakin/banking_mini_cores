syntax = "proto3";

package auth.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/auth-service/internal/pb/gen/auth/v1;authv1";

import "common/v1/actor.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  rpc CreateOfficer(CreateOfficerRequest) returns (CreateOfficerResponse) {
    option (google.api.http) = {
      post: "/v1/auth/officers"
      body: "*"
    };
  }
}

message User {
  string user_id = 1;
  string email = 2;
  common.v1.Role role = 3;
  string customer_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string idempotency_key = 3;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  common.v1.Role role = 3;
  string customer_id = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message CreateOfficerRequest {
  string email = 1;
  string password = 2;
  string idempotency_key = 3;
}

message CreateOfficerResponse {
  User user = 1;
}
