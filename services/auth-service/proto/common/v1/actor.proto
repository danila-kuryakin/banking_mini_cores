syntax = "proto3";

package common.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/auth-service/internal/pb/gen/common/v1;commonv1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CLIENT = 1;
  ROLE_OFFICER = 2;
  ROLE_ADMIN = 3;
}

message Actor {
  string id = 1;
  Role role = 2;
}
