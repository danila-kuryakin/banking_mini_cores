# antifraud-service: gRPC-сервис + собственный PostgreSQL 16.
#
# Стек самодостаточен: поднимается и работает без остальных сервисов.
# Связь с ними — через общую внешнюю сеть banking-net:
#
#   docker network create banking-net   # один раз на машину
#   docker compose up -d --build

name: banking-antifraud

x-service-env: &service-env
  # В контейнере слушать localhost нельзя — снаружи такой порт недоступен.
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "50057"
  DATABASE_HOST: antifraud-db
  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER:-banking}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-123}
  DATABASE_DBNAME: ${DATABASE_DBNAME:-banking_antifraud}
  DATABASE_SSL_MODE: disable

services:
  antifraud-db:
    image: postgres:16-alpine
    container_name: banking-antifraud-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-banking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123}
      POSTGRES_DB: ${DATABASE_DBNAME:-banking_antifraud}
    ports:
      # Наружу — нестандартный порт, чтобы не спорить с локальным postgres
      # и с БД соседних сервисов.
      - "${ANTIFRAUD_DB_PORT:-5439}:5432"
    volumes:
      - antifraud-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-banking} -d ${DATABASE_DBNAME:-banking_antifraud}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [banking-net]

  antifraud-service:
    build:
      context: ../..
      dockerfile: services/antifraud-service/Dockerfile
    image: banking/antifraud-service:local
    container_name: antifraud-service
    environment: *service-env
    ports:
      - "${ANTIFRAUD_GRPC_PORT:-50057}:50057"
    depends_on:
      antifraud-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  antifraud-db-data:

networks:
  banking-net:
    external: true
