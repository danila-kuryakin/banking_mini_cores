name: banking-antifraud


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-antifraud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_antifraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_antifraud}
    ports:
      - "${POSTGRES_PORT:-5457}:5432"
    volumes:
      - antifraud-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_antifraud} -d ${POSTGRES_DB:-banking_antifraud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  antifraud-service:
    build:
      context: ../..
      dockerfile: services/antifraud-service/Dockerfile
    image: banking/antifraud-service:local
    container_name: antifraud-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по порту с хоста.
      DATABASE_HOST: banking-antifraud-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_antifraud}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_antifraud}
      # Внутри сети брокер зовётся kafka:9092, localhost:29092 - адрес только для хоста.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${SERVER_PORT:-50057}:50057"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  antifraud-pgdata:

networks:
  banking-net:
    external: true
