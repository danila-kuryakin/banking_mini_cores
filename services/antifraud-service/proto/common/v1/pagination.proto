syntax = "proto3";

package common.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/antifraud-service/internal/pb/gen/common/v1;commonv1";

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
  int32 total_size = 2;
}
