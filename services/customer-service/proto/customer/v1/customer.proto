syntax = "proto3";

package customer.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/api-gateway/internal/pb/gen/customer/v1;customerv1";

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

service CustomerService {
  rpc CreateProfile(CreateProfileRequest) returns (Customer);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc GetCustomerStatus(GetCustomerStatusRequest) returns (Customer);
  rpc UpdateProfile(UpdateProfileRequest) returns (Customer);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
}

enum CustomerStatus {
  CUSTOMER_STATUS_NEW = 0;
  CUSTOMER_STATUS_PROFILE_FILLED = 1;
  CUSTOMER_STATUS_ON_KYC = 2;
  CUSTOMER_STATUS_ACTIVE = 3;
  CUSTOMER_STATUS_REJECTED = 4;
  CUSTOMER_STATUS_BLOCKED = 5;
}

message Profile {
  string first_name = 1;
  string last_name = 2;
  google.type.Date birth_date = 3;
  string citizenship = 4;
  string phone = 5;
}

message Customer {
  string id = 1;
  string user_id = 2;
  CustomerStatus status = 3;
  Profile profile = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateProfileRequest {
  string user_id = 1;
  Profile profile = 2;
}

message GetCustomerRequest {
  string id = 1;
}

message UpdateProfileRequest {
  string id = 1;
  Profile profile = 2;
}

message GetCustomerStatusRequest {
  string id = 1;
}

message GetCustomerStatusResponse {
  CustomerStatus status = 1;
  google.protobuf.Timestamp changed_at = 2;
}

message ListCustomersRequest {
  CustomerStatus status = 1;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
}
