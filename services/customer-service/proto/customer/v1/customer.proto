syntax = "proto3";

package customer.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/customer-service/internal/pb/gen/customer/v1;customerv1";

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

service CustomerService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc GetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (Customer);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
}

enum CustomerStatus {
  UNSPECIFIED = 0;
  NEW = 1;
  PROFILE_FILLED = 2;
  ON_KYC = 3;
  ACTIVE = 4;
  REJECTED = 5;
  BLOCKED = 6;
}

message Profile {
  string first_name = 1;
  string last_name = 2;
  google.type.Date birth_date = 3;
  string citizenship = 4;
  string phone = 5;
}

message Customer {
  string id = 1;
  string user_id = 2;
  CustomerStatus status = 3;
  google.protobuf.Timestamp status_changed_at = 4;
  Profile profile = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateProfileRequest {
  string user_id = 1;
}

message CreateProfileResponse {
  string id = 1;
  string user_id = 2;
  CustomerStatus status = 3;
  google.protobuf.Timestamp status_changed_at = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetCustomerRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  Profile profile = 2;
}

message GetCustomerStatusRequest {
  string user_id = 1;
}

message GetCustomerStatusResponse {
  CustomerStatus status = 1;
  google.protobuf.Timestamp status_changed_at = 2;
}

message ListCustomersRequest {
  int32 limit = 2;
  int32 offset = 3;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
}
