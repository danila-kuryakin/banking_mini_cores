# customer-service: gRPC-сервис + собственный PostgreSQL 16.
#
# Стек самодостаточен: поднимается и работает без остальных сервисов.
# Связь с ними — через общую внешнюю сеть banking-net:
#
#   docker network create banking-net   # один раз на машину
#   docker compose up -d --build

name: banking-customer

x-service-env: &service-env
  # В контейнере слушать localhost нельзя — снаружи такой порт недоступен.
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "50052"
  DATABASE_HOST: customer-db
  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER:-banking}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-123}
  DATABASE_DBNAME: ${DATABASE_DBNAME:-banking_customer}
  DATABASE_SSL_MODE: disable
  # Брокер общий и живёт в services/kafka-service - свой сервис его не поднимает.
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: customer.events
  KAFKA_GROUP_ID: customer-service
  KAFKA_CLIENT_ID: customer-service

services:
  customer-db:
    image: postgres:16-alpine
    container_name: banking-customer-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-banking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123}
      POSTGRES_DB: ${DATABASE_DBNAME:-banking_customer}
    ports:
      # Наружу — нестандартный порт, чтобы не спорить с локальным postgres
      # и с БД соседних сервисов.
      - "${CUSTOMER_DB_PORT:-5434}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-banking} -d ${DATABASE_DBNAME:-banking_customer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [banking-net]

  # Разовая задача: накатывает миграции и завершается. Сервис стартует только
  # после её успешного выхода.
  customer-migrate:
    build: &service-build
      context: ../..
      dockerfile: services/customer-service/Dockerfile
    # Отдельный тег, хотя Dockerfile и слои те же: два compose-сервиса с одним
    # тегом заставляют buildx собирать его дважды параллельно, и вторая сборка
    # падает на "image already exists".
    image: banking/customer-migrate:local
    container_name: banking-customer-migrate
    entrypoint: ["/app/migrate"]
    command: ["-cmd=up"]
    environment: *service-env
    depends_on:
      customer-db:
        condition: service_healthy
    restart: "no"
    networks: [banking-net]

  customer-service:
    build: *service-build
    image: banking/customer-service:local
    container_name: customer-service
    environment: *service-env
    ports:
      - "${CUSTOMER_GRPC_PORT:-50052}:50052"
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [banking-net]

volumes:
  customer-db-data:

networks:
  banking-net:
    external: true
