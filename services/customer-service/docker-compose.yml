name: banking-customer


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-customer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_customer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_customer}
    ports:
      - "${POSTGRES_PORT:-5452}:5432"
    volumes:
      - customer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_customer} -d ${POSTGRES_DB:-banking_customer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  customer-service:
    build:
      context: ../..
      dockerfile: services/customer-service/Dockerfile
    image: banking/customer-service:local
    container_name: customer-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по 5452.
      DATABASE_HOST: banking-customer-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_customer}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_customer}
    ports:
      - "${SERVER_PORT:-50052}:50052"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  customer-pgdata:

networks:
  banking-net:
    external: true
