name: banking-filestore


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-filestore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_filestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_filestore}
    ports:
      # Наружу - нестандартный порт, чтобы не спорить с локальным postgres и с
      # базами соседних сервисов. Последние две цифры совпадают с портом gRPC.
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - filestore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_filestore} -d ${POSTGRES_DB:-banking_filestore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  minio:
    image: minio/minio:latest
    container_name: banking-filestore-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - filestore-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

volumes:
  filestore-pgdata:
  filestore-minio-data:

networks:
  banking-net:
    external: true
