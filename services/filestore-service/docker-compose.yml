name: banking-filestore


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-filestore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_filestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_filestore}
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - filestore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_filestore} -d ${POSTGRES_DB:-banking_filestore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  minio:
    image: minio/minio:latest
    container_name: banking-filestore-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - filestore-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  filestore-service:
    build:
      context: ../..
      dockerfile: services/filestore-service/Dockerfile
    image: banking/filestore-service:local
    container_name: filestore-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по порту с хоста.
      DATABASE_HOST: banking-filestore-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_filestore}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_filestore}
      # Хост из endpoint попадает в подпись presigned-ссылки, поэтому имя должно открываться и из сети, и с хоста.
      MINIO_CONFIG_ENDPOINT: host.docker.internal:${MINIO_PORT:-9000}
      MINIO_CONFIG_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_CONFIG_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${SERVER_PORT:-50054}:50054"
    # На Linux имени host.docker.internal нет само по себе, Docker Desktop его и так знает.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  filestore-pgdata:
  filestore-minio-data:

networks:
  banking-net:
    external: true
