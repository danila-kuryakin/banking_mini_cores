basePath: /api/v1
definitions:
  dto.Account:
    properties:
      created_at:
        type: string
      currency:
        example: RUB
        type: string
      id:
        type: string
      number:
        example: "40817810500000000001"
        type: string
      status:
        enum:
        - active
        - blocked
        - closed
        example: active
        type: string
      status_changed_at:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.AddSanctionEntry:
    properties:
      birth_date:
        example: "1980-01-15"
        type: string
      first_name:
        example: Ivan
        type: string
      last_name:
        example: Petrov
        type: string
      source:
        example: OFAC SDN
        type: string
    type: object
  dto.Application:
    properties:
      checks:
        items:
          $ref: '#/definitions/dto.Check'
        type: array
      created_at:
        type: string
      decided_at:
        type: string
      events:
        items:
          $ref: '#/definitions/dto.Event'
        type: array
      id:
        type: string
      reason:
        type: string
      requested_types:
        example:
        - proof_of_address
        items:
          type: string
        type: array
      reviewer_id:
        type: string
      status:
        enum:
        - submitted
        - auto_checks
        - auto_rejected
        - in_review
        - docs_requested
        - approved
        - rejected
        example: in_review
        type: string
      submitted_at:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.ApproveApplication:
    properties:
      comment:
        example: всё сходится
        type: string
    type: object
  dto.Balance:
    properties:
      account_id:
        type: string
      amount:
        example: 150000
        type: integer
      currency:
        example: RUB
        type: string
    type: object
  dto.BlockAccount:
    properties:
      reason:
        example: подозрительные операции
        type: string
    type: object
  dto.Check:
    properties:
      created_at:
        type: string
      details:
        type: string
      id:
        type: string
      result:
        enum:
        - passed
        - failed
        example: passed
        type: string
      type:
        enum:
        - sanctions
        - age
        example: sanctions
        type: string
    type: object
  dto.CreateOfficerRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.Customer:
    properties:
      created_at:
        type: string
      id:
        type: string
      profile:
        $ref: '#/definitions/dto.Profile'
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.CustomerStatus:
    properties:
      changed_at:
        type: string
      status:
        type: string
    type: object
  dto.Deposit:
    properties:
      amount:
        example: 100000
        type: integer
      currency:
        example: RUB
        type: string
    type: object
  dto.DownloadTicket:
    properties:
      expires_at:
        type: string
      url:
        type: string
    type: object
  dto.Entry:
    properties:
      account_id:
        type: string
      amount:
        example: 10000
        type: integer
      currency:
        example: RUB
        type: string
      direction:
        enum:
        - debit
        - credit
        example: debit
        type: string
      id:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  dto.Event:
    properties:
      actor_id:
        type: string
      comment:
        type: string
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: string
      to_status:
        type: string
    type: object
  dto.File:
    properties:
      confirmed_at:
        type: string
      content_type:
        example: image/png
        type: string
      created_at:
        type: string
      filename:
        type: string
      id:
        type: string
      sha256:
        type: string
      size_bytes:
        type: integer
      status:
        example: confirmed
        type: string
      type:
        example: passport
        type: string
      user_id:
        type: string
    type: object
  dto.InitUpload:
    properties:
      filename:
        example: passport.png
        type: string
      type:
        enum:
        - passport
        - selfie
        - proof_of_address
        example: passport
        type: string
    type: object
  dto.ListAccounts:
    properties:
      accounts:
        items:
          $ref: '#/definitions/dto.Account'
        type: array
    type: object
  dto.ListApplications:
    properties:
      applications:
        items:
          $ref: '#/definitions/dto.Application'
        type: array
    type: object
  dto.ListCustomers:
    properties:
      customers:
        items:
          $ref: '#/definitions/dto.Customer'
        type: array
    type: object
  dto.ListFiles:
    properties:
      files:
        items:
          $ref: '#/definitions/dto.File'
        type: array
    type: object
  dto.ListNotifications:
    properties:
      notifications:
        items:
          $ref: '#/definitions/dto.Notification'
        type: array
    type: object
  dto.ListRules:
    properties:
      rules:
        items:
          $ref: '#/definitions/dto.Rule'
        type: array
    type: object
  dto.ListSanctions:
    properties:
      entries:
        items:
          $ref: '#/definitions/dto.SanctionEntry'
        type: array
    type: object
  dto.ListStatusHistory:
    properties:
      changes:
        items:
          $ref: '#/definitions/dto.StatusChange'
        type: array
    type: object
  dto.ListTransactions:
    properties:
      transactions:
        items:
          $ref: '#/definitions/dto.Transaction'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      tokens:
        $ref: '#/definitions/dto.TokenPair'
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.Notification:
    properties:
      created_at:
        type: string
      event_id:
        type: string
      event_type:
        example: ledger.transaction_completed
        type: string
      id:
        type: string
      text:
        type: string
    type: object
  dto.OpenAccount:
    properties:
      currency:
        example: RUB
        type: string
    type: object
  dto.Profile:
    properties:
      birth_date:
        type: string
      citizenship:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  dto.RejectApplication:
    properties:
      reason:
        example: документы не совпадают с анкетой
        type: string
    type: object
  dto.RequestDocuments:
    properties:
      comment:
        example: нужна справка о месте жительства
        type: string
      types:
        example:
        - proof_of_address
        items:
          enum:
          - passport
          - selfie
          - proof_of_address
          type: string
        type: array
    type: object
  dto.RequiredFiles:
    properties:
      missing:
        example:
        - selfie
        items:
          type: string
        type: array
      ok:
        type: boolean
    type: object
  dto.Rule:
    properties:
      code:
        enum:
        - single_amount_limit
        - velocity
        - daily_amount_limit
        - same_account
        example: velocity
        type: string
      description:
        type: string
      enabled:
        type: boolean
      params:
        $ref: '#/definitions/dto.RuleParams'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  dto.RuleParams:
    properties:
      limits:
        additionalProperties:
          format: int64
          type: integer
        description: Суммы по валютам в минорных единицах; валюта без порога правилом
          не проверяется.
        type: object
      max_count:
        example: 5
        type: integer
      window_seconds:
        example: 60
        type: integer
    type: object
  dto.SanctionEntry:
    properties:
      birth_date:
        example: "1980-01-15"
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      source:
        type: string
    type: object
  dto.StatusChange:
    properties:
      account_id:
        type: string
      actor_id:
        type: string
      created_at:
        type: string
      from_status:
        enum:
        - active
        - blocked
        - closed
        example: active
        type: string
      id:
        example: 1
        type: integer
      reason:
        example: подозрительные операции
        type: string
      to_status:
        enum:
        - active
        - blocked
        - closed
        example: blocked
        type: string
    type: object
  dto.TokenPair:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
    type: object
  dto.Transaction:
    properties:
      amount:
        example: 10000
        type: integer
      created_at:
        type: string
      currency:
        example: RUB
        type: string
      decline_reason:
        type: string
      entries:
        items:
          $ref: '#/definitions/dto.Entry'
        type: array
      from_account_id:
        type: string
      id:
        type: string
      initiator_id:
        type: string
      status:
        enum:
        - completed
        - declined
        example: completed
        type: string
      to_account_id:
        type: string
      type:
        enum:
        - transfer
        - deposit
        example: transfer
        type: string
    type: object
  dto.Transfer:
    properties:
      amount:
        example: 10000
        type: integer
      currency:
        example: RUB
        type: string
      from_account_id:
        type: string
      to_account_id:
        type: string
      to_account_number:
        example: "40817810400000000014"
        type: string
    type: object
  dto.UnblockAccount:
    properties:
      comment:
        example: проверка завершена
        type: string
    type: object
  dto.UpdateProfile:
    properties:
      birth_date:
        type: string
      citizenship:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdateRule:
    properties:
      enabled:
        example: true
        type: boolean
      params:
        $ref: '#/definitions/dto.RuleParams'
    type: object
  dto.UploadTicket:
    properties:
      expires_at:
        type: string
      file_id:
        type: string
      upload_url:
        type: string
    type: object
  dto.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  dto.ValidateTokenRequest:
    properties:
      access_token:
        type: string
    required:
    - access_token
    type: object
  dto.ValidateTokenResponse:
    properties:
      expires_at:
        type: string
      id:
        type: string
      role:
        type: string
      valid:
        type: boolean
    type: object
info:
  contact:
    name: Danila Kuryakin
    url: https://github.com/danila-kuryakin/banking_mini_cores
  description: 'HTTP-фасад над gRPC-сервисами: аутентификация, работа с клиентами
    и их файлами.'
  title: Banking Mini Cores API Gateway
  version: "1.0"
paths:
  /accounts/{account_id}/block:
    post:
      consumes:
      - application/json
      description: Блокировка с обязательной причиной. Заблокированный счёт не участвует
        в переводах и пополнениях.
      parameters:
      - description: UUID счёта
        in: path
        name: account_id
        required: true
        type: string
      - description: Причина блокировки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BlockAccount'
      produces:
      - application/json
      responses:
        "200":
          description: Счёт заблокирован
          schema:
            $ref: '#/definitions/dto.Account'
        "400":
          description: Причина не указана или счёт закрыт
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Счёт не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Заблокировать счёт
      tags:
      - accounts
  /accounts/{account_id}/deposit:
    post:
      consumes:
      - application/json
      description: 'Пополнение для тестов: дебет кассового счёта леджера, кредит счёта
        клиента. Сумма в минорных единицах.'
      parameters:
      - description: UUID счёта
        in: path
        name: account_id
        required: true
        type: string
      - description: Сумма и валюта
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Deposit'
      produces:
      - application/json
      responses:
        "200":
          description: Пополнение проведено
          schema:
            $ref: '#/definitions/dto.Transaction'
        "400":
          description: Некорректная сумма, валюта не совпадает или счёт не активен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Счёт не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Пополнить счёт из кассы
      tags:
      - ledger
  /accounts/{account_id}/history:
    get:
      description: Все смены статуса счёта, от новых к старым. Первая запись без from_status
        - открытие счёта. Пустой actor_id - действие владельца или системы. Только
        для сотрудников.
      parameters:
      - description: UUID счёта
        in: path
        name: account_id
        required: true
        type: string
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: История статусов
          schema:
            $ref: '#/definitions/dto.ListStatusHistory'
        "400":
          description: Некорректная пагинация
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Счёт не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: История статусов счёта
      tags:
      - accounts
  /accounts/{account_id}/unblock:
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID счёта
        in: path
        name: account_id
        required: true
        type: string
      - description: Комментарий
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.UnblockAccount'
      produces:
      - application/json
      responses:
        "200":
          description: Счёт снова активен
          schema:
            $ref: '#/definitions/dto.Account'
        "400":
          description: Счёт закрыт
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Счёт не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Разблокировать счёт
      tags:
      - accounts
  /antifraud/rules:
    get:
      description: Все правила с порогами и признаком включения. Суммы в минорных
        единицах по валютам.
      produces:
      - application/json
      responses:
        "200":
          description: Правила
          schema:
            $ref: '#/definitions/dto.ListRules'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Правила антифрода
      tags:
      - antifraud
  /antifraud/rules/{code}:
    patch:
      consumes:
      - application/json
      description: Включает, выключает правило или меняет пороги. Не переданное поле
        не меняется, переданные params заменяют пороги целиком. single_amount_limit
        и daily_amount_limit читают limits по валютам из конфига, velocity - max_count
        и window_seconds, у same_account порогов нет. Действует со следующей проверки.
      parameters:
      - description: Код правила
        enum:
        - single_amount_limit
        - velocity
        - daily_amount_limit
        - same_account
        in: path
        name: code
        required: true
        type: string
      - description: Изменения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRule'
      produces:
      - application/json
      responses:
        "200":
          description: Правило после изменения
          schema:
            $ref: '#/definitions/dto.Rule'
        "400":
          description: Пустой запрос или пороги не подходят правилу
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Правило не найдено
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменить правило антифрода
      tags:
      - antifraud
  /auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает данные пользователя и пару токенов. Access-токен передаётся
        дальше в заголовке Authorization.
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь и пара токенов
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Тело запроса не прошло валидацию
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Слишком много неудачных попыток по этому email или сервис перегружен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Ошибка auth-service
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Вход по email и паролю
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Отзывает refresh-токен. Ранее выданный access-токен продолжает
        действовать до истечения срока. Повторный выход тем же токеном, а также неизвестный
        или уже отозванный токен тоже дают 204.
      parameters:
      - description: Refresh-токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Сессия завершена, тело ответа пустое
        "400":
          description: Тело запроса не прошло валидацию
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Ошибка auth-service
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Выход из сессии
      tags:
      - auth
  /auth/officers:
    post:
      consumes:
      - application/json
      description: Заводит учётную запись с ролью officer. Доступно только роли admin.
      parameters:
      - description: Email и пароль сотрудника
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOfficerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Сотрудник создан
          schema:
            $ref: '#/definitions/dto.User'
        "400":
          description: Тело запроса не прошло валидацию
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
