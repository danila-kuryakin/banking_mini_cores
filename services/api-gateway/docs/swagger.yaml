      tags:
      - kyc
    post:
      description: Требует заполненной анкеты и подтверждённых документов (паспорт
        и селфи). Если по заявке запрашивали документы, в очередь возвращается та
        же заявка. Проверки идут в фоне, ответ приходит сразу.
      parameters:
      - description: UUID пользователя или me - текущий пользователь
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявка подана
          schema:
            $ref: '#/definitions/dto.Application'
        "400":
          description: Анкета не заполнена или не хватает документов
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Заявка принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: У клиента уже есть активная заявка
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Подать заявку на верификацию
      tags:
      - kyc
  /customer/{user_id}/notifications:
    get:
      description: 'Уведомления, «отправленные» клиенту по событиям переводов и KYC,
        от новых к старым. Отправка - мок: уведомление только записывается.'
      parameters:
      - description: UUID пользователя или me - текущий пользователь
        in: path
        name: user_id
        required: true
        type: string
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Уведомления
          schema:
            $ref: '#/definitions/dto.ListNotifications'
        "400":
          description: Некорректная пагинация
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Чужой клиент
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Уведомления клиента
      tags:
      - notification
  /customer/{user_id}/status:
    get:
      description: 'Возвращает текущий статус и момент его последней смены. Возможные
        значения: new, profile_filled, on_kyc, active, rejected, blocked.'
      parameters:
      - description: UUID пользователя или me - текущий пользователь
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Текущий статус
          schema:
            $ref: '#/definitions/dto.CustomerStatus'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Профиль принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Клиент не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Статус клиента
      tags:
      - customer
  /customer/{user_id}/transfers:
    post:
      consumes:
      - application/json
      description: 'Списывает со своего счёта и зачисляет на счёт получателя в той
        же валюте. Получатель задаётся ровно одним полем: to_account_id (UUID) или
        to_account_number (20 цифр). Оба счёта должны быть активны. Сумма в минорных
        единицах. При нехватке средств перевод сохраняется со статусом declined и
        возвращается 400 с его id в тексте ошибки.'
      parameters:
      - description: UUID пользователя или me - владелец счёта-источника
        in: path
        name: user_id
        required: true
        type: string
      - description: Перевод
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Transfer'
      produces:
      - application/json
      responses:
        "200":
          description: Перевод проведён
          schema:
            $ref: '#/definitions/dto.Transaction'
        "400":
          description: Некорректная сумма, валюта или номер счёта, получатель не задан
            или задан дважды, счёт не активен, не хватает средств
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Счёт-источник принадлежит другому клиенту
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Счёт не найден, в том числе получатель по номеру
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Перевод между счетами
      tags:
      - ledger
  /kyc/applications:
    get:
      description: 'Очередь для сотрудника. Без фильтров - все заявки. Свободные для
        взятия в работу: status=in_review&unassigned=true. Свои: reviewer_id=me. Результаты
        проверок и история в листинге не отдаются.'
      parameters:
      - collectionFormat: multi
        description: Фильтр по статусам, параметр можно повторять
        in: query
        items:
          enum:
          - submitted
          - auto_checks
          - auto_rejected
          - in_review
          - docs_requested
          - approved
          - rejected
          type: string
        name: status
        type: array
      - description: UUID офицера или me - текущий сотрудник
        in: query
        name: reviewer_id
        type: string
      - description: Только заявки, которые никто не взял в работу; нельзя вместе
          с reviewer_id
        in: query
        name: unassigned
        type: boolean
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявки
          schema:
            $ref: '#/definitions/dto.ListApplications'
        "400":
          description: Неизвестный статус или unassigned вместе с reviewer_id
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Очередь заявок
      tags:
      - kyc
  /kyc/applications/{application_id}:
    get:
      description: Заявка вместе с результатами авто-проверок и историей переходов.
        Для сотрудников.
      parameters:
      - description: UUID заявки
        in: path
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявка
          schema:
            $ref: '#/definitions/dto.Application'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Заявка по идентификатору
      tags:
      - kyc
  /kyc/applications/{application_id}/approve:
    post:
      consumes:
      - application/json
      description: Одобряет заявку и переводит клиента в active.
      parameters:
      - description: UUID заявки
        in: path
        name: application_id
        required: true
        type: string
      - description: Комментарий
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.ApproveApplication'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка одобрена
          schema:
            $ref: '#/definitions/dto.Application'
        "400":
          description: Заявка не в том статусе
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Одобрить заявку
      tags:
      - kyc
  /kyc/applications/{application_id}/claim:
    post:
      description: Закрепляет заявку за текущим сотрудником. Занятую заявку второй
        раз взять нельзя.
      parameters:
      - description: UUID заявки
        in: path
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявка закреплена
          schema:
            $ref: '#/definitions/dto.Application'
        "400":
          description: Заявка уже взята или не в том статусе
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Взять заявку в работу
      tags:
      - kyc
  /kyc/applications/{application_id}/documents:
    post:
      consumes:
      - application/json
      description: Возвращает заявку клиенту с просьбой догрузить документы указанных
        типов. Клиент остаётся на проверке; после загрузки он подаёт ту же заявку
        снова.
      parameters:
      - description: UUID заявки
        in: path
        name: application_id
        required: true
        type: string
      - description: Типы документов и комментарий
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestDocuments'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка возвращена клиенту
          schema:
            $ref: '#/definitions/dto.Application'
        "400":
          description: Неизвестный тип документа или заявка не в том статусе
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Запросить документы
      tags:
      - kyc
  /kyc/applications/{application_id}/reject:
    post:
      consumes:
      - application/json
      description: Отказ с обязательной причиной. Клиент уходит в rejected окончательно
        - в отличие от авто-отказа, который возвращает его в profile_filled.
      parameters:
      - description: UUID заявки
        in: path
        name: application_id
        required: true
        type: string
      - description: Причина отказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RejectApplication'
      produces:
      - application/json
      responses:
        "200":
          description: Отказ зафиксирован
          schema:
            $ref: '#/definitions/dto.Application'
        "400":
          description: Причина не указана или заявка не в том статусе
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отказать по заявке
      tags:
      - kyc
  /kyc/sanctions:
    get:
      description: Все люди в санкционном списке, по алфавиту. Записи из этого списка
        сверяются с анкетой при авто-проверке заявки.
      parameters:
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Санкционный список
          schema:
            $ref: '#/definitions/dto.ListSanctions'
        "400":
          description: Некорректная пагинация
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Санкционный список
      tags:
      - kyc
    post:
      consumes:
      - application/json
      description: 'Запись участвует в авто-проверке новых заявок: совпадение имени,
        фамилии и даты рождения без учёта регистра даёт авто-отказ. Уже разобранные
        заявки заново не проверяются.'
      parameters:
      - description: Человек
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddSanctionEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Запись добавлена
          schema:
            $ref: '#/definitions/dto.SanctionEntry'
        "400":
          description: Не заполнены или некорректны имя, фамилия, дата рождения
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Человек уже есть в списке
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавить человека в санкционный список
      tags:
      - kyc
  /transactions/{transaction_id}:
    get:
      description: 'Для сотрудников: транзакция вместе с дебетовой и кредитовой платежами.'
      parameters:
      - description: UUID транзакции
        in: path
        name: transaction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Транзакция
          schema:
            $ref: '#/definitions/dto.Transaction'
        "401":
          description: Отсутствует или недействителен access-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Транзакция не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Транзакция платежей
      tags:
      - ledger
securityDefinitions:
  BearerAuth:
    description: Access-токен из POST /auth/login в формате "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Регистрация, вход, обновление и отзыв токенов
  name: auth
- description: Карточка клиента, профиль и статус
  name: customer
- description: Загрузка и выдача файлов клиента через presigned-ссылки
  name: files
- description: 'Счета клиента: открытие, блокировка, закрытие, баланс'
  name: accounts
- description: Переводы, пополнения и выписки; суммы в минорных единицах валюты
  name: ledger
