syntax = "proto3";

package document.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/api-gateway/internal/pb/gen/document/v1;documentv1";

import "common/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// DocumentService хранит документы клиента: сканы паспорта, селфи,
// подтверждение адреса.
//
// Байты файлов через это API не ходят. Загрузка и скачивание идут напрямую в
// объектное хранилище по предподписанным ссылкам, а сервис ведёт только
// метаданные и выдаёт эти ссылки. Так крупные бинарники не попадают в
// gRPC-тракт, где они занимали бы соединения и упирались в лимит размера
// сообщения.
service DocumentService {
  // InitUpload регистрирует намерение загрузить файл и возвращает ссылку, куда
  // его положить PUT-запросом. С этого момента документ существует в статусе
  // PENDING, и байтов за ним ещё нет.
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse) {
    option (google.api.http) = {
      post: "/v1/documents:initUpload"
      body: "*"
    };
  }

  // ConfirmUpload сообщает сервису, что байты уже в хранилище.
  //
  // Нужен потому, что загрузка идёт мимо сервиса: без этого вызова никто не
  // узнает, что передача завершилась. Документ, который так и не подтвердили,
  // остаётся в PENDING и со временем вычищается.
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse) {
    option (google.api.http) = {
      post: "/v1/documents/{document_id}:confirm"
      body: "*"
    };
  }

  // GetDownloadUrl выдаёт короткоживущую ссылку на чтение файла.
  //
  // Выдаётся на каждый запрос, а не хранится в Document: ссылка, лежащая в
  // базе, — это ссылка, утекающая вместе с дампом базы.
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse) {
    option (google.api.http) = {get: "/v1/documents/{document_id}/download-url"};
  }

  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}/documents"};
  }

  // HasRequiredDocuments отвечает на вопрос "всё ли нужное у клиента есть".
  //
  // HTTP-маппинга нет: его зовёт kyc-service, прежде чем двинуть анкету
  // дальше, и клиентам он не предназначен.
  rpc HasRequiredDocuments(HasRequiredDocumentsRequest) returns (HasRequiredDocumentsResponse);
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;

  // Скан документа, удостоверяющего личность.
  DOCUMENT_TYPE_PASSPORT = 1;

  // Фотография клиента, сверяется с паспортом: доказывает, что документ
  // принадлежит тому, кто его предъявляет.
  DOCUMENT_TYPE_SELFIE = 2;

  // Счёт за коммунальные услуги или выписка, подтверждающая Profile.address.
  DOCUMENT_TYPE_PROOF_OF_ADDRESS = 3;
}

// DocumentStatus отслеживает загрузку, а не проверку по существу:
//
//   PENDING -> UPLOADED -> CONFIRMED
//                       -> REJECTED
enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;

  // InitUpload прошёл, байтов в хранилище ещё нет.
  DOCUMENT_STATUS_PENDING = 1;

  // Байты в хранилище, проверка не проводилась.
  DOCUMENT_STATUS_UPLOADED = 2;

  // Проверен и принят. В HasRequiredDocuments засчитываются только документы в
  // этом статусе.
  DOCUMENT_STATUS_CONFIRMED = 3;

  // Нечитаемый, не того типа или не сошлась контрольная сумма. Клиент грузит
  // замену, а не исправляет этот.
  DOCUMENT_STATUS_REJECTED = 4;
}

// Document — метаданные о хранимом файле. Ключа в хранилище тут намеренно нет:
// клиенты получают предподписанные ссылки, а не путь, по которому можно
// побродить.
message Document {
  string document_id = 1;
  string customer_id = 2;
  DocumentType type = 3;
  DocumentStatus status = 4;

  // Исходное имя от клиента. Только для показа: значение задаёт атакующий, и
  // строить из него путь в хранилище нельзя.
  string file_name = 5;

  // MIME-тип, заявленный при InitUpload, например "image/jpeg".
  string content_type = 6;

  int64 size_bytes = 7;

  // SHA-256 файла в hex. Передаётся в ConfirmUpload и сверяется с сохранённым
  // объектом. Доказывает, что дошли те байты, которые отправляли, и даёт
  // аудиту то, на что можно сослаться потом.
  string sha256 = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp confirmed_at = 10;
}

message InitUploadRequest {
  string customer_id = 1;
  DocumentType type = 2;
  string file_name = 3;

  // Заявленный MIME-тип. Сервис ограничивает, что принимает: разрешить
  // произвольные типы — значит превратить хранилище документов в раздачу
  // вредоносных файлов.
  string content_type = 4;

  // Заявленный размер. Проверяется против лимита до выдачи ссылки, поэтому
  // слишком большой файл отвергается до загрузки, а не после.
  int64 size_bytes = 5;

  string idempotency_key = 6;
}

message InitUploadResponse {
  string document_id = 1;

  // Предподписанная ссылка, куда класть байты методом PUT. Одноразового
  // назначения и с коротким сроком; пока жива — обращаться как с секретом.
  string upload_url = 2;

  // Заголовки, которые надо отправить с PUT дословно. Подпись покрывает и их,
  // поэтому пропущенный или изменённый заголовок заставит хранилище отклонить
  // загрузку.
  map<string, string> required_headers = 3;

  // Когда upload_url перестанет работать. После этого — снова InitUpload.
  google.protobuf.Timestamp expires_at = 4;
}

message ConfirmUploadRequest {
  string document_id = 1;

  // SHA-256 в hex, посчитанный клиентом по отправленным байтам. Несовпадение
  // означает, что загрузка побилась или её подменили, и документ отклоняется.
  string sha256 = 2;

  string idempotency_key = 3;
}

message ConfirmUploadResponse {
  Document document = 1;
}

message GetDownloadUrlRequest {
  string document_id = 1;
}

message GetDownloadUrlResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListDocumentsRequest {
  string customer_id = 1;

  // Фильтр по типам. Пусто — все типы: пустой список означает "без фильтра", а
  // не "ничего не возвращать".
  repeated DocumentType types = 2;

  common.v1.PageRequest page = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  common.v1.PageResponse page = 2;
}

message HasRequiredDocumentsRequest {
  string customer_id = 1;

  // Что именно нужно вызывающему. Набор требований принадлежит его политике, а
  // не этому сервису, поэтому и передаётся снаружи: правила KYC отличаются от
  // юрисдикции к юрисдикции и от типа анкеты.
  repeated DocumentType required_types = 2;
}

message HasRequiredDocumentsResponse {
  // True, когда для каждого требуемого типа есть документ в статусе CONFIRMED.
  bool satisfied = 1;

  // Каких типов не хватает. Заполняется, когда satisfied = false, чтобы
  // вызывающий сказал клиенту, что догрузить, без второго запроса.
  repeated DocumentType missing_types = 2;
}
