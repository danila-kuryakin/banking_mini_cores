syntax = "proto3";

package antifraud.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/api-gateway/internal/pb/gen/antifraud/v1;antifraudv1";

import "common/v1/money.proto";
import "common/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AntifraudService {
  rpc CheckTransfer(CheckTransferRequest) returns (CheckTransferResponse) {
    option (google.api.http) = {
      post: "/v1/antifraud/transfer"
    };
  }

  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (google.api.http) = {get: "/v1/antifraud/rules"};
  }

  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse) {
    option (google.api.http) = {
      patch: "/v1/antifraud/rules/{rule_id}"
      body: "*"
    };
  }

  rpc ListChecks(ListChecksRequest) returns (ListChecksResponse) {
    option (google.api.http) = {get: "/v1/antifraud/checks"};
  }
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
}

enum RuleType {
  RULE_TYPE_UNSPECIFIED = 0;
  RULE_TYPE_SINGLE_AMOUNT_LIMIT = 1;
  RULE_TYPE_VELOCITY = 2;
  RULE_TYPE_SELF_TRANSFER = 4;
}

message Rule {
  string rule_id = 1;
  RuleType type = 2;
  bool enabled = 3;
  map<string, string> parameters = 4;
  string description = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message TriggeredRule {
  string rule_id = 1;
  RuleType type = 2;
  string reason = 3;
}

message Check {
  string check_id = 1;
  string transaction_id = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  common.v1.Money amount = 5;
  Verdict verdict = 6;
  repeated TriggeredRule triggered_rules = 7;
  google.protobuf.Timestamp checked_at = 8;
}

message CheckTransferRequest {
  string transaction_id = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  string customer_id = 4;
  common.v1.Money amount = 5;
  string idempotency_key = 6;
}

message CheckTransferResponse {
  string check_id = 1;
  Verdict verdict = 2;
  repeated TriggeredRule triggered_rules = 3;
}

message ListRulesRequest {
  common.v1.PageRequest page = 1;
}

message ListRulesResponse {
  repeated Rule rules = 1;
  common.v1.PageResponse page = 2;
}

message UpdateRuleRequest {
  string rule_id = 1;
  bool enabled = 2;
  map<string, string> parameters = 3;
  string idempotency_key = 4;
}

message UpdateRuleResponse {
  Rule rule = 1;
}

message ListChecksRequest {
  string account_id = 1;
  Verdict verdict = 2;
  common.v1.PageRequest page = 3;
}

message ListChecksResponse {
  repeated Check checks = 1;
  common.v1.PageResponse page = 2;
}
