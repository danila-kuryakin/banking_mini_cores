syntax = "proto3";

package customer.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/api-gateway/internal/pb/gen/customer/v1;customerv1";

import "common/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

service CustomerService {
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}"};
  }

  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/customers/{customer_id}"
      body: "*"
    };
  }

  rpc GetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}/status"};
  }

  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {get: "/v1/customers"};
  }
}

// CustomerStatus is driven by KYC events, never set directly by the customer.
//
//   NEW -> PROFILE_FILLED -> ON_KYC -> ACTIVE
//                                   -> REJECTED
//   any -> BLOCKED
enum CustomerStatus {
  CUSTOMER_STATUS_UNSPECIFIED = 0;
  CUSTOMER_STATUS_NEW = 1;
  CUSTOMER_STATUS_PROFILE_FILLED = 2;
  CUSTOMER_STATUS_ON_KYC = 3;
  CUSTOMER_STATUS_ACTIVE = 4;
  CUSTOMER_STATUS_REJECTED = 5;
  CUSTOMER_STATUS_BLOCKED = 6;
}

message Address {
  string country = 1;
  string city = 2;
  string street = 3;
  string building = 4;
  string postal_code = 5;
}

message Profile {
  string first_name = 1;
  string last_name = 2;
  google.type.Date birth_date = 3;
  string citizenship = 4;
  string phone = 5;
  Address address = 6;
}

message Customer {
  string customer_id = 1;
  string user_id = 2;
  CustomerStatus status = 3;
  Profile profile = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetCustomerRequest {
  string customer_id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message UpdateProfileRequest {
  string customer_id = 1;
  Profile profile = 2;
  string idempotency_key = 3;
}

message UpdateProfileResponse {
  Customer customer = 1;
}

message GetCustomerStatusRequest {
  string customer_id = 1;
}

message GetCustomerStatusResponse {
  CustomerStatus status = 1;
  google.protobuf.Timestamp changed_at = 2;
}

message ListCustomersRequest {
  CustomerStatus status = 1;
  common.v1.PageRequest page = 2;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  common.v1.PageResponse page = 2;
}
