syntax = "proto3";

package account.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/api-gateway/internal/pb/gen/account/v1;accountv1";

import "common/v1/money.proto";
import "common/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// AccountService владеет самими счетами: открытием, блокировкой, закрытием.
//
// Деньги он не двигает — это дело ledger-service. Разделение важно потому, что
// счёт — долгоживущий объект со статусом, а баланс — производное число,
// считать которое вправе только реестр проводок.
service AccountService {
  // OpenAccount открывает счёт клиенту, прошедшему KYC. Открыть счёт тому, кто
  // его не прошёл, — ровно то, ради предотвращения чего KYC и существует.
  rpc OpenAccount(OpenAccountRequest) returns (OpenAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
    };
  }

  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {get: "/v1/accounts/{account_id}"};
  }

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/accounts"};
  }

  // BlockAccount замораживает счёт: ни списаний, ни зачислений. Обратимо, в
  // отличие от закрытия.
  rpc BlockAccount(BlockAccountRequest) returns (BlockAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts/{account_id}:block"
      body: "*"
    };
  }

// TODO: пока не реализовано — без этого метода заблокированный счёт нельзя
// разморозить никогда. Сообщения UnblockAccountRequest и UnblockAccountResponse
// ниже уже описаны и не используются, пока метод не включён.
//  rpc UnblockAccount(UnblockAccountRequest) returns (UnblockAccountResponse) {
//    option (google.api.http) = {
//      post: "/v1/accounts/{account_id}:unblock"
//      body: "*"
//    };
//  }

  // CloseAccount закрывает счёт навсегда. Требует нулевого баланса: закрыть
  // счёт поверх чужих денег — значит оставить средства без владельца по
  // документам.
  rpc CloseAccount(CloseAccountRequest) returns (CloseAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts/{account_id}:close"
      body: "*"
    };
  }

  // GetBalance возвращает баланс для показа.
  //
  // Это удобная обёртка над ledger-service, который и есть источник правды. Не
  // используйте её, чтобы разрешить перевод: значение успевает устареть к
  // моменту чтения, а проверить баланс и списать деньги одним атомарным шагом
  // способен только реестр.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {get: "/v1/accounts/{account_id}/balance"};
  }
}

// Переходы AccountStatus:
//
//   ACTIVE  -> BLOCKED -> ACTIVE
//   ACTIVE  -> CLOSED
//
// CLOSED терминален.
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;

  // Обычное состояние. Деньги ходят в обе стороны.
  ACCOUNT_STATUS_ACTIVE = 1;

  // Заморожен. Баланс и история читаются, но ни одна проводка счёт не тронет.
  // Обратимо.
  ACCOUNT_STATUS_BLOCKED = 2;

  // Закрыт окончательно. Счёт при этом сохраняется, а не удаляется: история
  // его проводок нужна аудиту ещё долго после ухода клиента.
  ACCOUNT_STATUS_CLOSED = 3;
}

message Account {
  // Внутренний идентификатор. Используется везде между сервисами.
  string account_id = 1;

  string customer_id = 2;

  // Номер, который клиент видит и диктует по телефону, например IBAN.
  //
  // Отдельно от account_id намеренно: показываемый номер следует публичному
  // формату с контрольной суммой и может быть перевыпущен, а внутренний id
  // непрозрачен и меняться не должен никогда.
  string account_number = 3;

  // Код ISO 4217. Фиксируется при открытии — счёт держит ровно одну валюту,
  // поэтому конвертации счёта попросту не бывает.
  string currency = 4;

  AccountStatus status = 5;

  // Почему заблокирован. Проставляется вместе с BLOCKED и сохраняется потом
  // для аудита.
  string block_reason = 6;

  google.protobuf.Timestamp opened_at = 7;
  google.protobuf.Timestamp closed_at = 8;
}

message OpenAccountRequest {
  string customer_id = 1;

  // Код ISO 4217 открываемого счёта. По счёту на валюту: кому нужны две
  // валюты, тот открывает два счёта.
  string currency = 2;

  // Без него повторённый запрос откроет второй счёт — и, в отличие от
  // задвоенного чтения, отменить это клиент сам не сможет.
  string idempotency_key = 3;
}

message OpenAccountResponse {
  Account account = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message ListAccountsRequest {
  // Чьи счета. Клиент вправе передать только свой customer_id.
  string customer_id = 1;

  // UNSPECIFIED — любой статус, включая закрытые счета.
  AccountStatus status = 2;

  common.v1.PageRequest page = 3;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  common.v1.PageResponse page = 2;
}

message BlockAccountRequest {
  string account_id = 1;

  // Почему — подозрение в мошенничестве, решение суда, просьба клиента.
  // Сохраняется на счёте: заморозку, которую потом никто не может объяснить,
  // никто и не решится снять.
  string reason = 2;

  string idempotency_key = 3;
}

message BlockAccountResponse {
  Account account = 1;
}

// Не используется, пока метод UnblockAccount выше закомментирован.
message UnblockAccountRequest {
  string account_id = 1;
  string idempotency_key = 2;
}

// Не используется, пока метод UnblockAccount выше закомментирован.
message UnblockAccountResponse {
  Account account = 1;
}

message CloseAccountRequest {
  string account_id = 1;
  string idempotency_key = 2;
}

message CloseAccountResponse {
  Account account = 1;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  common.v1.Money balance = 1;

  // Момент, на который посчитан баланс. Баланс без отметки времени
  // неопровержим в дурном смысле: читатель не отличит актуальную цифру от
  // взятой из кеша.
  google.protobuf.Timestamp as_of = 2;
}
