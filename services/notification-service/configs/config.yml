server:
  host: localhost
  port: 50058

# Шина событий. Сервис только читает: publish-топик ему не нужен, поэтому
# заполнен topics, а не topic.
#
# 29092 - это порт, который брокер из docker-compose публикует на хост.
# Внутри docker-сети сервис ходит на kafka:9092, туда его переключает
# переменная KAFKA_BROKERS из compose-файла.
#
# Закомментированный brokers или topics - штатный режим: сервис поднимется
# без Kafka, а ListNotifications будет отдавать пустой список. Именно
# закомментировать, а не задать KAFKA_BROKERS= пустым: viper считает пустую
# переменную окружения незаданной, и значение отсюда останется в силе.
#
# Непустые списки из окружения задаются строкой через запятую.
kafka:
  brokers:
    - localhost:29092
  topics:
    - auth.events
    - customer.events
    - kyc.events
    - ledger.events
  group_id: notification-service
  client_id: notification-service
  # first - при первом запуске прочитать топик с начала, а не только новое.
  # Для сервиса, который показывает, что вообще происходило в шине, это
  # полезнее умолчания. После первого коммита группа продолжает со своего
  # оффсета, и настройка перестаёт на что-либо влиять.
  start_offset: first
  # 0 - коммитить оффсет вручную, после того как уведомление сохранено.
  commit_interval: 0
  max_wait: 500ms
