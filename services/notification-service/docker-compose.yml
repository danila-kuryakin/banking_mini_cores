name: banking-notification


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-notification-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_notification}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_notification}
    ports:
      - "${POSTGRES_PORT:-5458}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_notification} -d ${POSTGRES_DB:-banking_notification}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: banking/notification-service:local
    container_name: notification-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по порту с хоста.
      DATABASE_HOST: banking-notification-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_notification}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_notification}
      # Внутри сети брокер зовётся kafka:9092, localhost:29092 - адрес только для хоста.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${SERVER_PORT:-50058}:50058"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  notification-pgdata:

networks:
  banking-net:
    external: true
