name: banking-notification


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-notification-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_notification}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_notification}
    ports:
      - "${POSTGRES_PORT:-5458}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_notification} -d ${POSTGRES_DB:-banking_notification}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

volumes:
  notification-pgdata:

networks:
  banking-net:
    external: true
