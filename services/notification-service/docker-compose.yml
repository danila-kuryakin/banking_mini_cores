# notification-service: gRPC-сервис + консьюмер Kafka.
#
# Своей БД у сервиса нет - уведомления живут в памяти процесса. Брокер общий
# и живёт в services/kafka-service, виден через внешнюю сеть banking-net.
#
#   docker network create banking-net                            # один раз на машину
#   docker compose -f ../kafka-service/docker-compose.yml up -d  # общий брокер
#   docker compose up -d --build

name: banking-notification

services:
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: banking/notification-service:local
    container_name: notification-service
    environment:
      # В контейнере слушать localhost нельзя — снаружи такой порт недоступен.
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "50058"
      # Внутри сети брокер зовётся kafka, снаружи - localhost:29092.
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-auth.events,customer.events,kyc.events,ledger.events}
      KAFKA_GROUP_ID: notification-service
      KAFKA_CLIENT_ID: notification-service
      KAFKA_START_OFFSET: first
    ports:
      - "${NOTIFICATION_GRPC_PORT:-50058}:50058"
    restart: unless-stopped
    networks: [banking-net]

networks:
  banking-net:
    external: true
