name: banking-kyc


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-kyc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_kyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_kyc}
    ports:
      - "${POSTGRES_PORT:-5453}:5432"
    volumes:
      - kyc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_kyc} -d ${POSTGRES_DB:-banking_kyc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  kyc-service:
    build:
      context: ../..
      dockerfile: services/kyc-service/Dockerfile
    image: banking/kyc-service:local
    container_name: kyc-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по порту с хоста.
      DATABASE_HOST: banking-kyc-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_kyc}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_kyc}
      UPSTREAMS_CUSTOMER: customer-service:50052
      UPSTREAMS_FILESTORE: filestore-service:50054
      # Внутри сети брокер зовётся kafka:9092, localhost:29092 - адрес только для хоста.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${SERVER_PORT:-50053}:50053"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  kyc-pgdata:

networks:
  banking-net:
    external: true
