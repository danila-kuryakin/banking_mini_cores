# kyc-service: gRPC-сервис + собственный PostgreSQL 16.
#
# Стек самодостаточен: поднимается и работает без остальных сервисов.
# Связь с ними — через общую внешнюю сеть banking-net:
#
#   docker network create banking-net   # один раз на машину
#   docker compose up -d --build

name: banking-kyc

x-service-env: &service-env
  # В контейнере слушать localhost нельзя — снаружи такой порт недоступен.
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "50053"
  DATABASE_HOST: kyc-db
  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER:-banking}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-123}
  DATABASE_DBNAME: ${DATABASE_DBNAME:-banking_kyc}
  DATABASE_SSL_MODE: disable
  # Брокер общий и живёт в services/kafka-service - свой сервис его не поднимает.
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: kyc.events
  KAFKA_GROUP_ID: kyc-service
  KAFKA_CLIENT_ID: kyc-service

services:
  kyc-db:
    image: postgres:16-alpine
    container_name: banking-kyc-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-banking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123}
      POSTGRES_DB: ${DATABASE_DBNAME:-banking_kyc}
    ports:
      # Наружу — нестандартный порт, чтобы не спорить с локальным postgres
      # и с БД соседних сервисов.
      - "${KYC_DB_PORT:-5435}:5432"
    volumes:
      - kyc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-banking} -d ${DATABASE_DBNAME:-banking_kyc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [banking-net]

  kyc-service:
    build:
      context: ../..
      dockerfile: services/kyc-service/Dockerfile
    image: banking/kyc-service:local
    container_name: kyc-service
    environment: *service-env
    ports:
      - "${KYC_GRPC_PORT:-50053}:50053"
    depends_on:
      kyc-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  kyc-db-data:

networks:
  banking-net:
    external: true
