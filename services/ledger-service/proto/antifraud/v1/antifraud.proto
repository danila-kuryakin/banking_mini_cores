syntax = "proto3";

package antifraud.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/ledger-service/internal/pb/gen/antifraud/v1;antifraudv1";

import "google/protobuf/timestamp.proto";

service AntifraudService {
  rpc CheckTransfer(CheckTransferRequest) returns (CheckTransferResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc UpdateRule(UpdateRuleRequest) returns (Rule);
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_DENY = 2;
}

message CheckTransferRequest {
  // Владелец счёта-источника.
  string initiator_id = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  // Сумма в минорных единицах валюты.
  int64 amount = 4;
  string currency = 5;
}

message CheckTransferResponse {
  // Запись в af_checks, по ней проверку можно найти в журнале.
  string check_id = 1;
  Verdict verdict = 2;
  // Сработавшие правила. Непусто только у DENY.
  repeated string reasons = 3;
}

// Пороги правила. Каждое правило читает только свои поля.
message RuleParams {
  // Суммы по валютам в минорных единицах. Валюта без порога правилом не проверяется.
  map<string, int64> limits = 1;
  // Velocity: сколько разрешённых переводов допустимо за окно.
  int32 max_count = 2;
  int32 window_seconds = 3;
}

message Rule {
  string code = 1;
  string description = 2;
  bool enabled = 3;
  RuleParams params = 4;
  // Кто правил последним. Пусто, пока правило не меняли.
  string updated_by = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListRulesRequest {}

message ListRulesResponse {
  repeated Rule rules = 1;
}

message UpdateRuleRequest {
  string code = 1;
  // Не задано - включённость не меняется.
  optional bool enabled = 2;
  // Не задано - пороги не меняются, задано - заменяются целиком.
  RuleParams params = 3;
  string officer_id = 4;
}
