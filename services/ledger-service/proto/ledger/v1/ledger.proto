syntax = "proto3";

package ledger.v1;

option go_package = "github.com/danila-kuryakin/banking_mini_cores/services/ledger-service/internal/pb/gen/ledger/v1;ledgerv1";

import "common/v1/money.proto";
import "common/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service LedgerService {
  rpc Transfer(TransferRequest) returns (TransferResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/transfers"
      body: "*"
    };
  }

  rpc Deposit(DepositRequest) returns (DepositResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/deposits"
      body: "*"
    };
  }

  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {
    option (google.api.http) = {get: "/v1/ledger/transactions/{transaction_id}"};
  }

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {get: "/v1/ledger/accounts/{account_id}/transactions"};
  }

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_TRANSFER = 1;
  TRANSACTION_TYPE_DEPOSIT = 2;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_COMPLETED = 2;
  TRANSACTION_STATUS_DECLINED = 3;
}

enum EntryDirection {
  ENTRY_DIRECTION_UNSPECIFIED = 0;
  ENTRY_DIRECTION_DEBIT = 1;
  ENTRY_DIRECTION_CREDIT = 2;
}

message Entry {
  string entry_id = 1;
  string transaction_id = 2;
  string account_id = 3;
  EntryDirection direction = 4;
  common.v1.Money amount = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Transaction {
  string transaction_id = 1;
  TransactionType type = 2;
  TransactionStatus status = 3;
  common.v1.Money amount = 4;
  string from_account_id = 5;
  string to_account_id = 6;
  string description = 7;
  string decline_reason = 8;
  repeated Entry entries = 9;
  string idempotency_key = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  common.v1.Money amount = 3;
  string description = 4;
  string idempotency_key = 5;
}

message TransferResponse {
  Transaction transaction = 1;
}

message DepositRequest {
  string to_account_id = 1;
  common.v1.Money amount = 2;
  string description = 3;
  string idempotency_key = 4;
}

message DepositResponse {
  Transaction transaction = 1;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message ListTransactionsRequest {
  string account_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  common.v1.PageRequest page = 4;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  common.v1.PageResponse page = 2;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  common.v1.Money balance = 1;
  google.protobuf.Timestamp as_of = 2;
}
