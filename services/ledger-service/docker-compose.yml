name: banking-ledger


# для удобства отладки создал контейнеры
services:
  postgres:
    image: postgres:16
    container_name: banking-ledger-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-banking_ledger}
    ports:
      - "${POSTGRES_PORT:-5456}:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_ledger} -d ${POSTGRES_DB:-banking_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [banking-net]

  ledger-service:
    build:
      context: ../..
      dockerfile: services/ledger-service/Dockerfile
    image: banking/ledger-service:local
    container_name: ledger-service
    environment:
      SERVER_HOST: 0.0.0.0
      # База адресуется по имени контейнера и внутреннему порту, а не по порту с хоста.
      DATABASE_HOST: banking-ledger-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-banking_ledger}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      DATABASE_DBNAME: ${POSTGRES_DB:-banking_ledger}
      UPSTREAMS_ACCOUNT: account-service:50055
      UPSTREAMS_ANTIFRAUD: antifraud-service:50057
      # Внутри сети брокер зовётся kafka:9092, localhost:29092 - адрес только для хоста.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${SERVER_PORT:-50056}:50056"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  ledger-pgdata:

networks:
  banking-net:
    external: true
