# ledger-service: gRPC-сервис + собственный PostgreSQL 16.
#
# Стек самодостаточен: поднимается и работает без остальных сервисов.
# Связь с ними — через общую внешнюю сеть banking-net:
#
#   docker network create banking-net   # один раз на машину
#   docker compose up -d --build

name: banking-ledger

x-service-env: &service-env
  # В контейнере слушать localhost нельзя — снаружи такой порт недоступен.
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "50056"
  DATABASE_HOST: ledger-db
  DATABASE_PORT: "5432"
  DATABASE_USER: ${DATABASE_USER:-banking}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-123}
  DATABASE_DBNAME: ${DATABASE_DBNAME:-banking_ledger}
  DATABASE_SSL_MODE: disable
  # Брокер общий и живёт в services/kafka-service - свой сервис его не поднимает.
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: ledger.events
  KAFKA_GROUP_ID: ledger-service
  KAFKA_CLIENT_ID: ledger-service

services:
  ledger-db:
    image: postgres:16-alpine
    container_name: banking-ledger-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-banking}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123}
      POSTGRES_DB: ${DATABASE_DBNAME:-banking_ledger}
    ports:
      # Наружу — нестандартный порт, чтобы не спорить с локальным postgres
      # и с БД соседних сервисов.
      - "${LEDGER_DB_PORT:-5438}:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-banking} -d ${DATABASE_DBNAME:-banking_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [banking-net]

  ledger-service:
    build:
      context: ../..
      dockerfile: services/ledger-service/Dockerfile
    image: banking/ledger-service:local
    container_name: ledger-service
    environment: *service-env
    ports:
      - "${LEDGER_GRPC_PORT:-50056}:50056"
    depends_on:
      ledger-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking-net]

volumes:
  ledger-db-data:

networks:
  banking-net:
    external: true
